name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --release --locked
        timeout-minutes: 15

  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: aarch64
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename binary
        shell: pwsh
        # Binaries are named without a version suffix so install-ops.exe --binary ops-x64.exe
        # works without knowing the release version. Versioning comes from the GitHub release tag.
        run: |
          Copy-Item "target/${{ matrix.target }}/release/ops.exe" "ops-${{ matrix.suffix }}.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ops-${{ matrix.suffix }}
          path: ops-${{ matrix.suffix }}.exe
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing via Sigstore OIDC
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign binaries + checksums (keyless / Sigstore)
        working-directory: dist
        # Produces <file>.sig (signature) + <file>.pem (certificate) for each binary
        # and SHA256SUMS. Verify with:
        #   cosign verify-blob --certificate <f>.pem --signature <f>.sig \
        #     --certificate-identity-regexp 'https://github.com/AIWander/ops/.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <f>
        run: |
          for f in *.exe SHA256SUMS; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS
            dist/*.sig
            dist/*.pem
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## Release assets

            | File | Platform | Notes |
            |------|----------|-------|
            | `ops-x64.exe` | Windows x64 | Main server binary |
            | `ops-aarch64.exe` | Windows ARM64 | Main server binary |
            | `install-ops-x64.exe` | Windows x64 | **Companion installer** - manually attached after CI |
            | `SHA256SUMS` | — | Checksums for every binary |
            | `*.sig` / `*.pem` | — | Sigstore (keyless cosign) signature + certificate per file |

            ### Verifying the download

            Check integrity: `sha256sum -c SHA256SUMS`. Verify authenticity (signed by this
            repo's GitHub Actions, no key to manage):

            ```bash
            cosign verify-blob --certificate ops-x64.exe.pem --signature ops-x64.exe.sig \
              --certificate-identity-regexp 'https://github.com/AIWander/ops/.*' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ops-x64.exe
            ```

            ### Quick install (x64)

            Download `ops-x64.exe` and `install-ops-x64.exe`, place them in the same directory, then run:

            ```
            install-ops-x64.exe --binary ops-x64.exe
            ```

            ### Companion installer

            `install-ops-x64.exe` is built separately from the `ops-installer` companion crate
            and manually attached to each release. It backs up your Claude Desktop config,
            copies `ops.exe` to the chosen location, and registers the server - all in one step.

            ARM64 installer is not yet available; ARM64 users should edit
            `claude_desktop_config.json` manually (see `claude_desktop_config.example.json`).

            ### Build from source

            ```bash
            git clone https://github.com/AIWander/ops.git
            cd ops
            cargo build --release
            ```

            <!-- TODO v0.2.1: automate installer build and attach in this workflow.
                 The ops-installer crate lives at ops-installer/ in the source repo.
                 Build with: cargo build --release -p ops-installer
                 Then upload install-ops-x64.exe as a release asset alongside the main binaries. -->
